<!DOCTYPE html>
<html>
<head>
  <title>My Game Website</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
      margin-top: 60px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #score {
      font-size: 40px;
      margin: 20px;
    }
  </style>
</head>

<body>
  <h1>🎮 Clicker Game</h1>
  <p>Click the button to gain points!</p>

  <div id="score">0</div>

  <button onclick="addPoint()">CLICK ME</button>

  <script>
    let score = 0;

    function addPoint() {
      score++;
      document.getElementById("score").innerText = score;
    }
  </script>
</body>
</html>
